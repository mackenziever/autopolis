name: Civitas CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit pip-audit
      - name: Tests
        run: PYTHONDONTWRITEBYTECODE=1 pytest -q
      - name: Audit
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 python run_audit.py
      - name: Bandit
        run: bandit -q -r agents engine llm telemetry world metrics security -x tests || true
      - name: SBOM
        run: python scripts/generate_sbom.py
      - name: Lockfile
        run: python scripts/generate_lockfile.py
      - name: CVE scan
        run: python scripts/scan_cve.py || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain
          path: |
            sbom.json
            requirements.lock.json
            audit/runtime/summary.json
            audit/runtime/cve_scan.json
