<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Civitas — Deterministic Replay</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui;background:#070a10;color:#edf3ff}*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#111827;border-bottom:1px solid #29354b;box-shadow:0 6px 20px #0008;z-index:3}.brand{font-weight:800;letter-spacing:.08em;color:#65e6c4}.top button,.top select,.top input::file-selector-button{background:#1d293c;color:#edf3ff;border:1px solid #40506a;border-radius:7px;padding:7px 11px}.top input[type=range]{flex:1;accent-color:#65e6c4}.stage{position:relative;min-height:0}.hud,.legend{position:absolute;z-index:2;background:#0c1320e8;border:1px solid #344158;border-radius:10px;padding:11px;backdrop-filter:blur(8px);font:12px ui-monospace,monospace}.hud{right:12px;top:12px;min-width:235px}.legend{left:12px;bottom:12px;display:grid;grid-template-columns:auto auto;gap:6px 10px}.dot{width:9px;height:9px;border-radius:99px;display:inline-block;margin-right:5px}canvas{display:block;width:100%;height:100%}
</style></head><body>
<div class="top"><span class="brand">CIVITAS</span><input id="file" type="file" accept=".msgpack,.bin"><button id="play">▶ Play</button><label>Vel. <select id="speed"><option>.25</option><option>.5</option><option selected>1</option><option>2</option><option>4</option><option>8</option></select>×</label><input id="scrub" type="range" min="0" max="0" value="0"><b id="tick">tick 0</b></div>
<div class="stage"><canvas id="c"></canvas><div class="hud" id="hud">Carica il file replay.</div><div class="legend" id="legend"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/msgpack-lite/0.1.26/msgpack.min.js"></script>
<script>
const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d'),colors={IDLE:'#f3f4f6',COMMUTING:'#38bdf8',WORKING:'#fbbf24',ATTENDING_CLASS:'#c084fc',SOCIALIZING:'#4ade80',EATING:'#fb7185',REST:'#94a3b8'};
$('legend').innerHTML=Object.entries(colors).map(([k,v])=>`<span><i class=dot style="background:${v}"></i></span><span>${k}</span>`).join('');
let header=null,ticks=[],idx=0,playing=false,last=0,acc=0,state={};
function resize(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;draw()}addEventListener('resize',resize);resize();
function parse(buf){const u=new Uint8Array(buf),dv=new DataView(buf);let o=0,recs=[];while(o+4<=u.length){const n=dv.getUint32(o);o+=4;if(o+n>u.length)break;recs.push(msgpack.decode(u.slice(o,o+n)));o+=n}header=recs.find(x=>x.record==='header');ticks=recs.filter(x=>x.record==='tick');$('scrub').max=Math.max(0,ticks.length-1);idx=0;rebuild(0)}
$('file').onchange=async e=>parse(await e.target.files[0].arrayBuffer());$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸ Pausa':'▶ Play'};$('scrub').oninput=e=>{idx=+e.target.value;rebuild(idx)};
function apply(t){for(const e of (t?.events||[]))if(e.type==='snapshot')state[e.agent_id]=e}
function rebuild(n){state={};for(let i=0;i<=n;i++)apply(ticks[i]);render()}
function render(){if(!header)return draw();$('scrub').value=idx;$('tick').textContent=`tick ${ticks[idx]?.tick??0}`;const counts={};Object.values(state).forEach(a=>counts[a.state]=(counts[a.state]||0)+1);$('hud').innerHTML=`<b>${header.metadata.agents} agenti</b><br>seed ${header.metadata.seed}<br>fingerprint ${header.metadata.fingerprint}<hr>${Object.entries(counts).map(x=>x.join(': ')).join('<br>')}`;draw()}
function draw(){const w=c.width,h=c.height;ctx.fillStyle='#080d16';ctx.fillRect(0,0,w,h);if(!header)return;const m=header.metadata,g=m.grid,pad=40*devicePixelRatio,s=Math.min((w-2*pad)/g[0],(h-2*pad)/g[1]),ox=(w-g[0]*s)/2,oy=(h-g[1]*s)/2;ctx.fillStyle='#111b2b';for(const [x,y] of m.blocked)ctx.fillRect(ox+x*s,oy+y*s,s,s);ctx.strokeStyle='#1a2940';ctx.lineWidth=1;for(let x=0;x<=g[0];x+=4){ctx.beginPath();ctx.moveTo(ox+x*s,oy);ctx.lineTo(ox+x*s,oy+g[1]*s);ctx.stroke()}for(let y=0;y<=g[1];y+=4){ctx.beginPath();ctx.moveTo(ox,oy+y*s);ctx.lineTo(ox+g[0]*s,oy+y*s);ctx.stroke()}for(const [name,p] of Object.entries(m.pois)){ctx.fillStyle='#ff5678';ctx.fillRect(ox+p[0]*s-3,oy+p[1]*s-3,7,7);ctx.fillStyle='#dce8f8';ctx.font=`${10*devicePixelRatio}px system-ui`;ctx.fillText(name,ox+p[0]*s+7,oy+p[1]*s-7)}for(const a of Object.values(state)){ctx.beginPath();ctx.fillStyle=colors[a.state]||'#fff';ctx.arc(ox+(a.x+.5)*s,oy+(a.y+.5)*s,Math.max(2.5*devicePixelRatio,s*.28),0,Math.PI*2);ctx.fill();ctx.strokeStyle='#071019';ctx.stroke()}}
function loop(t){if(!last)last=t;const dt=t-last;last=t;if(playing&&ticks.length){acc+=dt*+$('speed').value;const period=1000/(header.metadata.tick_rate_hz||15);while(acc>=period){acc-=period;idx=(idx+1)%ticks.length;apply(ticks[idx]);render()}}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
